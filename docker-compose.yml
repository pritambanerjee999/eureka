services:
  redis:
    image: redis:7-alpine
    # No host port: only the api and agent reach Redis, over the compose network.
    # (Also avoids clashing with a Redis already running on the tester's machine.)
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eureka
      POSTGRES_USER: eureka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eureka}
    # No host port: the database is only reachable from inside the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eureka"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend/api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  agent:
    build:
      context: ./backend/agent
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Frontend unit tests. Only runs when asked for:
  #   docker compose --profile test run --rm frontend-test
  frontend-test:
    build:
      context: ./frontend
      target: test
    profiles: ["test"]

volumes:
  redis_data:
  postgres_data:
